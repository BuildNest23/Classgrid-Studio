<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Details — ClassGrid</title>
<style>
:root{
  --bg:#f5f5f4;--card:#ffffff;--sub:#fafaf9;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--line2:#d6d3d1;
  --pri:#991b1b;--pri-h:#b91c1c;--pri-s:#fef2f2;--pri-l:#fecaca;
  --ok:#15803d;--ok-s:#f0fdf4;--ok-l:#bbf7d0;
  --warn:#b45309;--warn-s:#fffbeb;--warn-l:#fde68a;
  --chg:#fefce8;--chg-l:#facc15;
  --wa:#15803d;--wa-h:#166534;
  --sh:0 1px 2px rgba(28,25,23,.05);
  --sh-lg:0 16px 40px rgba(28,25,23,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09;--card:#1c1917;--sub:#161412;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--line2:#44403c;
    --pri:#dc2626;--pri-h:#ef4444;--pri-s:#2a1212;--pri-l:#7f1d1d;
    --ok:#4ade80;--ok-s:#0c2616;--ok-l:#166534;
    --warn:#fbbf24;--warn-s:#291c09;--warn-l:#92400e;
    --chg:#29220a;--chg-l:#854d0e;
    --wa:#16a34a;--wa-h:#15803d;
    --sh:none;--sh-lg:0 20px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a09;--card:#1c1917;--sub:#161412;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--line2:#44403c;
  --pri:#dc2626;--pri-h:#ef4444;--pri-s:#2a1212;--pri-l:#7f1d1d;
  --ok:#4ade80;--ok-s:#0c2616;--ok-l:#166534;
  --warn:#fbbf24;--warn-s:#291c09;--warn-l:#92400e;
  --chg:#29220a;--chg-l:#854d0e;
  --wa:#16a34a;--wa-h:#15803d;
  --sh:none;--sh-lg:0 20px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#printArea{display:none}

/* Sticky top bar (52px) */
.topbar{position:sticky;top:0;z-index:30;height:52px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:920px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;font-weight:800;font-size:12px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;flex:none}
.tb-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.save-ind{font-size:12px;color:var(--mute);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--line)}

/* Main container */
.wrap{max-width:920px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.sec{margin-top:12px}

/* School masthead */
.head{padding:14px 16px;display:flex;gap:14px;align-items:center}
.head img{width:48px;height:48px;object-fit:contain;border-radius:10px;flex:none}
.head-txt{min-width:0;flex:1}
.head h1{margin:0;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.head .meta{color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.head .kicker{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:2px}
.note-box{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:var(--pri-s);border:1px solid var(--pri-l);font-size:13.5px;white-space:pre-wrap;line-height:1.45}
.note-lbl{font-size:11.5px;font-weight:700;color:var(--pri);display:block;margin-bottom:2px}

/* Teacher name bar */
.name-bar{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name-bar label{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.name-bar input{flex:1;min-width:160px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--sub);font-size:15px}
.name-bar input:focus{outline:0;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}

/* Segmented control */
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:0 12px;white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--pri);color:#fff}

/* Progress strip */
.prog-card{padding:12px 16px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.prog-top strong{color:var(--ink);font-weight:700}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s ease-out}

.issues{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--pri-s);border:1px solid var(--pri-l);color:var(--pri);font-weight:600;font-size:13.5px;line-height:1.45}
.issues:empty{display:none}

/* Inputs */
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.lbl{font-size:12.5px;font-weight:600;color:var(--mute)}
.fld-reset{background:none;border:0;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer;padding:2px 6px;border-radius:6px}
.fld-reset:hover{background:var(--pri-s)}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;display:block;transition:border-color .15s,background .15s}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
.inp.chg{background:var(--chg);border-color:var(--chg-l)}
.inp.bad{border-color:var(--pri);background:var(--pri-s);color:var(--pri);font-weight:600}
.err{color:var(--pri);font-size:12.5px;font-weight:600;margin-top:4px}
.err:empty{display:none}

/* One-by-one card */
.pos{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.pos strong{color:var(--ink)}
.st-txt{font-weight:700;font-size:12.5px}
.st-txt.ok{color:var(--ok)}
.st-txt.need{color:var(--warn)}
.who{padding:16px 16px 6px}
.who .nm{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.01em;word-break:break-word}
.who .meta{margin-top:4px;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.who .meta b{color:var(--ink);font-weight:600}
.fields{padding:12px 16px 18px;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:680px){.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:1 / -1}}

/* Buttons */
.nav{display:flex;gap:10px;margin-top:12px}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .12s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.grow{flex:1}
.btn.main{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.main:hover:not(:disabled){background:var(--pri-h)}
.btn.ghost{background:var(--sub)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.text-actions{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px}
.tlink{background:none;border:0;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:8px;min-height:40px}
.tlink:hover{color:var(--ink);background:var(--line)}
.tlink.pri{color:var(--pri)}

/* Search & filter */
.search-wrap{position:relative}
.search-wrap input{padding-left:38px;padding-right:42px}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;display:flex}
.search-clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:8px;display:none;align-items:center;justify-content:center}
.search-clr.show{display:flex}
.flt-bar{display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--card);border:1px solid var(--line);margin-top:10px}
.flt-bar button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:0 8px;white-space:nowrap}
.flt-bar button.on{background:var(--ink);color:var(--card)}

/* Student list rows */
.list-card{margin-top:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer;min-height:60px;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--sub)}
.row.bad{background:var(--pri-s)}
.row .r{min-width:44px;text-align:center;font-weight:700;font-size:13.5px;color:var(--mute);background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:6px 4px;flex:none}
.row.bad .r{background:var(--pri-s);border-color:var(--pri-l);color:var(--pri)}
.row .m{min-width:0;flex:1}
.row .n{font-weight:600;font-size:15px;color:var(--ink);word-break:break-word;line-height:1.3}
.row .s{font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.35}
.row .st{font-size:12px;margin-top:3px;font-weight:600}
.row .st.ok{color:var(--ok)}
.row .st.need{color:var(--warn)}
.row .chg-txt{font-size:12px;font-weight:700;color:var(--warn);flex:none}
.empty{padding:32px 16px;text-align:center;color:var(--mute);font-size:14px}

/* Bottom thumb-zone bar (60px) */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:920px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .btn{min-height:44px}
.foot .btn.main{flex:1.4}

/* Share & Send bottom sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(12,10,9,.56);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;padding:0}
.sheet-bg.open{display:flex}
@media (min-width:640px){.sheet-bg{align-items:center;padding:16px}}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh-lg);animation:su .18s cubic-bezier(.16,1,.3,1)}
@media (min-width:640px){.sheet{border-radius:20px;padding:18px 20px}}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 12px}
@media (min-width:640px){.grab{display:none}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-head h2{margin:0;font-size:17px;font-weight:700}
.sh-sub{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.4}
.sh-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sub);border:1px solid var(--line);font-size:12.5px;color:var(--mute);line-height:1.45}
.sh-acts{margin-top:14px;display:grid;gap:10px}
.sh-btn{width:100%;min-height:52px;padding:10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--sub);color:var(--ink);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.sh-btn:hover{background:var(--line)}
.sh-btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.sh-btn.wa:hover{background:var(--wa-h)}
.sh-btn.wa .sh-d{color:rgba(255,255,255,.86)}
.sh-btn:disabled{opacity:.5;cursor:not-allowed}
.sh-ic{width:34px;height:34px;border-radius:9px;background:rgba(128,128,128,.12);display:flex;align-items:center;justify-content:center;flex:none}
.sh-btn.wa .sh-ic{background:rgba(255,255,255,.18)}
.sh-t{font-weight:700;font-size:14.5px;line-height:1.2}
.sh-d{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.3}
.sh-fb{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--ok-s);border:1px solid var(--ok-l);color:var(--ok);font-size:13px;font-weight:600;display:none}
.sh-fb.show{display:block}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92%;box-shadow:var(--sh-lg);text-align:center}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script id="cg-config" type="application/json">{}</script>
<script id="cg-work" type="application/json">{}</script>
<script>
(function(){
'use strict';
// Capture clean original HTML before any DOM or attribute changes (for Save copy).
var SRC='<!doctype html>\n'+document.documentElement.outerHTML;

function readJSON(id){try{return JSON.parse(document.getElementById(id).textContent||'{}')||{}}catch(e){return {}}}
var CFG=readJSON('cg-config');
var WORK=readJSON('cg-work');
var app=document.getElementById('app');

// Theme preference (persisted per device)
var THEME_KEY='cg-qf-theme';
function applyTheme(t){
  if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
try{applyTheme(localStorage.getItem(THEME_KEY)||'')}catch(e){}
function isDark(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t)return t==='dark';
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
}
function toggleTheme(){
  var next=isDark()?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  updateThemeIcon();
}

if(!CFG||CFG.app!=='classgrid-collect'||!CFG.students){
  app.innerHTML='<div class="wrap"><div class="card empty">This file has no student data. Ask your coordinator for a new form.</div></div>';
  return;
}

var FIELDS=[
 {k:'rollNo',l:'Roll #',mode:'numeric',type:'text'},
 {k:'name',l:'Name',type:'text'},
 {k:'fatherName',l:'Father Name',type:'text'},
 {k:'admissionNo',l:'Adm. No',type:'text'},
 {k:'phone',l:'Phone',mode:'tel',type:'tel'},
 {k:'address',l:'Address',tall:true},
 {k:'occupation',l:'Occupation',type:'text'},
 {k:'notes',l:'Notes',tall:true}
];
var COLS=FIELDS.filter(function(f){return CFG.fields&&CFG.fields[f.k]});
var STU=CFG.students;
var byId={};STU.forEach(function(s){byId[s.id]=s});
var editCols=COLS.filter(function(f){return CFG.fields[f.k]==='edit'});
var hasRoll=!!(CFG.fields&&CFG.fields.rollNo);
var ALLOW=!!CFG.allowAdd;
var addKeys=(CFG.addKeys&&CFG.addKeys.length)?CFG.addKeys:COLS.map(function(f){return f.k});
var addCols=FIELDS.filter(function(f){return f.k!=='rollNo'&&(addKeys.indexOf(f.k)>=0||f.k==='name')});
function colsFor(s){return s&&s.isNew?addCols:editCols}
var newSeq=0;

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function one(v){return String(v==null?'':v).replace(/\s*[\r\n]+\s*/g,' ')}

/* ---------- state ---------- */
var LSKEY='cgc:'+CFG.requestId;
var TEACHER_KEY='cg-qf-teacher';
var edits={}, from='', revision=0, savedAt=0, addedIds=[];
(function load(){
  var a=WORK&&WORK.edits?WORK:null, b=null;
  try{b=JSON.parse(localStorage.getItem(LSKEY)||'null')}catch(e){}
  var pick=a;
  if(b&&b.edits&&(!a||(b.savedAt||0)>(a.savedAt||0)))pick=b;
  if(pick){
    edits=pick.edits||{};from=pick.from||'';revision=pick.revision||0;savedAt=pick.savedAt||0;
    if(ALLOW&&pick.added&&pick.added.length)pick.added.forEach(function(id){
      if(!byId[id]){var o={id:id,isNew:true};STU.push(o);byId[id]=o;addedIds.push(id);var m=/^new_(\d+)$/.exec(id);if(m)newSeq=Math.max(newSeq,parseInt(m[1],10))}
    });
  }
  if(!from){try{from=localStorage.getItem(TEACHER_KEY)||''}catch(e){}}
})();
function cur(s,k){var e=edits[s.id];return (e&&Object.prototype.hasOwnProperty.call(e,k))?e[k]:(s[k]==null?'':s[k])}
function setVal(s,k,v){
  v=one(v);
  var orig=s[k]==null?'':String(s[k]);
  if(v===orig){if(edits[s.id]){delete edits[s.id][k];if(!Object.keys(edits[s.id]).length)delete edits[s.id]}}
  else{(edits[s.id]=edits[s.id]||{})[k]=v}
}
var saveT=null;
function setSaveInd(txt){var el=document.getElementById('saveInd');if(el)el.textContent=txt}
function persist(){
  setSaveInd('Saving...');
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{
      localStorage.setItem(LSKEY,JSON.stringify({edits:edits,from:from,revision:revision,savedAt:Date.now(),added:addedIds}));
      if(from)localStorage.setItem(TEACHER_KEY,from);
      setSaveInd('Saved');
    }catch(e){setSaveInd('')}
  },260);
}
function changeCount(){var n=0;Object.keys(edits).forEach(function(id){n+=Object.keys(edits[id]).length});return n}

/* ---------- helpers ---------- */
function rollKey(r){r=String(r||'').trim();return /^\d+$/.test(r)?String(parseInt(r,10)):r.toLowerCase()}
function sorted(){
  return STU.slice().sort(function(a,b){
    var x=String(cur(a,'rollNo')||'').trim(),y=String(cur(b,'rollNo')||'').trim();
    if(!x||!y)return x===y?0:(!x?1:-1);
    return x.localeCompare(y,undefined,{numeric:true});
  });
}
function toast(m){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove()},2800);
}
function safeName(s){return String(s||'file').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'file'}
var BASE=safeName((CFG.className||'class')+'_students_'+CFG.requestId);

/* ---------- screen ---------- */
var editable=editCols.length>0||ALLOW;
var ORDER=sorted();
var cursor=0, view=editable?'one':'list', filter='all', query='';
var LABEL={};FIELDS.forEach(function(f){LABEL[f.k]=f.l});

/* ----- status helpers ----- */
function emptyKeys(s){return colsFor(s).filter(function(f){return !String(cur(s,f.k)||'').trim()}).map(function(f){return f.k})}
function isChanged(s){return !!(s.isNew||(edits[s.id]&&Object.keys(edits[s.id]).length))}
var CURISSUES=0, DUP={}, BLANK={};
function computeIssues(){
  DUP={};BLANK={};
  var seen={},issues=[];
  if(hasRoll)STU.forEach(function(s){var r=String(cur(s,'rollNo')||'').trim();if(!r)return;var k=rollKey(r);(seen[k]=seen[k]||[]).push(s)});
  Object.keys(seen).forEach(function(k){
    if(seen[k].length>1){
      seen[k].forEach(function(s){DUP[s.id]=seen[k]});
      issues.push('Roll '+esc(String(cur(seen[k][0],'rollNo')).trim())+' is used by '+seen[k].map(function(s){return esc(cur(s,'name')||'(no name)')}).join(' and ')+'.');
    }
  });
  STU.forEach(function(s){if((s.isNew||CFG.fields.name==='edit')&&!String(cur(s,'name')||'').trim()){BLANK[s.id]=1}});
  if(Object.keys(BLANK).length)issues.push('A student name is empty. Names cannot be left blank.');
  CURISSUES=issues.length;
  document.getElementById('issues').innerHTML=issues.join('<br>');
}
function updateProgress(){
  var filled=0,total=0,done=0;
  STU.forEach(function(s){var e=emptyKeys(s),n=colsFor(s).length;total+=n;filled+=n-e.length;if(!e.length)done++});
  var w=document.getElementById('progWrap');
  if(editable){
    var pct=total?Math.round(filled*100/total):100;
    w.innerHTML='<div class="prog-top num"><span><strong>'+done+'</strong> of '+STU.length+' student'+(STU.length===1?'':'s')+' complete</span><span><strong>'+changeCount()+'</strong> edited'+(addedIds.length?' · <strong>'+addedIds.length+'</strong> added':'')+'</span></div>'
      +'<div class="pbar"><i style="width:'+pct+'%"></i></div>';
  }else{
    w.innerHTML='<div class="prog-top num"><span><strong>'+STU.length+'</strong> student'+(STU.length===1?'':'s')+'</span><span>Read-only list</span></div>';
  }
}

/* ----- one by one (in-place DOM reuse + continuous keyboard + scroll memory) ----- */
var renderedColsKey=null, oneScrollY=null, typingActive=false, navPressing=false, navPressT=null;
function nameOf(s){return String(cur(s,'name')||'').trim()||'(no name)'}
function isEditingField(){
  var a=document.activeElement;
  return !!(a&&a.getAttribute&&a.getAttribute('data-k'));
}
function focusFieldEnd(el){
  if(!el)return;
  try{el.focus({preventScroll:true})}catch(x){el.focus()}
  var len=String(el.value||'').length;
  try{el.setSelectionRange(len,len)}catch(x){}
}
function markNavPress(){
  navPressing=true;
  clearTimeout(navPressT);
  navPressT=setTimeout(function(){navPressing=false},450);
}
function drawOne(forceRebuild){
  var s=ORDER[cursor];
  if(!s){
    renderedColsKey=null;
    mainEl.innerHTML='<div class="card sec empty">'+(ALLOW?'No students yet. Tap <b>Add student</b> to enter the first student.':'No students in this file.')+'</div>'
      +(ALLOW?'<div class="nav"><button class="btn main grow" id="bAdd" type="button">+ Add student</button></div>':'');
    return;
  }
  var cols=colsFor(s);
  var colsKey=cols.map(function(f){return f.k}).join(',');
  var reuse=!forceRebuild&&renderedColsKey===colsKey&&!!document.getElementById('oneCard');
  if(!reuse){
    var h='<div class="card sec" id="oneCard"><div class="pos num"><span id="posNum"></span><span class="st-txt" id="badge"></span></div>';
    h+='<div class="who"><div class="nm" id="whoName"></div><div class="meta num" id="whoMeta"></div></div>';
    h+='<div class="fields">';
    cols.forEach(function(f){
      h+='<div'+(f.tall?' class="wide"':'')+'><div class="lbl-row"><label class="lbl" for="e_'+f.k+'">'+esc(f.l)+'</label>'
       +'<button class="fld-reset" type="button" data-rst="'+f.k+'" style="display:none">Reset</button></div>'
       +(f.tall
         ?'<textarea class="inp" id="e_'+f.k+'" data-k="'+f.k+'" rows="2" autocomplete="off" spellcheck="false"></textarea>'
         :'<input class="inp" type="'+(f.type||'text')+'" id="e_'+f.k+'" data-k="'+f.k+'" autocomplete="off" autocorrect="off" spellcheck="false"'+(f.mode?' inputmode="'+f.mode+'"':'')+'>')
       +'<div class="err" id="x_'+f.k+'"></div></div>';
    });
    h+='</div></div>';
    h+='<div class="nav"><button class="btn grow" id="bPrev" type="button">Previous</button><button class="btn main grow" id="bNext" type="button">Next</button></div>';
    h+='<div class="text-actions"><button class="tlink pri" id="bEmpty" type="button">Jump to next empty</button>'
      +(ALLOW?'<button class="tlink pri" id="bAdd" type="button">+ Add student</button>':'')
      +'<button class="tlink" id="bDel" type="button" style="display:none">Remove new student</button>'
      +'</div>';
    mainEl.innerHTML=h;
    renderedColsKey=colsKey;
  }
  var pn=document.getElementById('posNum');
  if(pn)pn.innerHTML='Student <strong>'+(cursor+1)+'</strong> of '+ORDER.length;
  cols.forEach(function(f){
    var el=document.getElementById('e_'+f.k);
    if(el)el.value=String(cur(s,f.k)||'');
  });
  var bp=document.getElementById('bPrev'),bn=document.getElementById('bNext'),bd=document.getElementById('bDel');
  if(bp)bp.disabled=cursor===0;
  if(bn)bn.disabled=cursor>=ORDER.length-1;
  if(bd)bd.style.display=s.isNew?'inline-block':'none';
  refreshOne();
}
function refreshOne(){
  var s=ORDER[cursor];if(!s)return;
  document.getElementById('whoName').textContent=nameOf(s);
  var parts=[];
  if(s.isNew)parts.push('New student');
  else if(hasRoll)parts.push('Roll <b>'+esc(String(cur(s,'rollNo')||'').trim()||'—')+'</b>');
  COLS.forEach(function(f){
    if(CFG.fields[f.k]!=='show'||f.k==='name'||f.k==='rollNo'||s.isNew||colsFor(s).some(function(c){return c.k===f.k}))return;
    var v=String(cur(s,f.k)||'').trim();if(v)parts.push(esc(f.l)+': <b>'+esc(v)+'</b>');
  });
  document.getElementById('whoMeta').innerHTML=parts.join(' · ');
  var e=emptyKeys(s),b=document.getElementById('badge');
  b.className='st-txt '+(e.length?'need':'ok');
  b.textContent=e.length?(e.length+' empty'):'Complete';
  colsFor(s).forEach(function(f){
    var t=document.getElementById('e_'+f.k),x=document.getElementById('x_'+f.k),rb=mainEl.querySelector('[data-rst="'+f.k+'"]');
    var changed=!s.isNew&&String(cur(s,f.k))!==String(s[f.k]==null?'':s[f.k]);
    t.classList.toggle('chg',changed);
    if(rb)rb.style.display=changed?'inline-block':'none';
    var msg='';
    if(f.k==='rollNo'&&DUP[s.id]){msg='Also used by '+DUP[s.id].filter(function(o){return o!==s}).map(nameOf).join(', ')+'. Roll numbers must be unique.'}
    if(f.k==='name'&&BLANK[s.id])msg='Name cannot be empty.';
    t.classList.toggle('bad',!!msg);x.textContent=msg;
  });
}
function go(i,forceFocus){
  if(i<0||i>=ORDER.length)return;
  var keepKeyboard=!!forceFocus||isEditingField()||typingActive;
  var savedY=window.scrollY||window.pageYOffset||0;
  navPressing=false;
  cursor=i;
  drawOne(false);
  if(keepKeyboard){
    var cols=colsFor(ORDER[cursor]);
    var firstKey=cols[0]&&cols[0].k;
    var target=firstKey&&document.getElementById('e_'+firstKey);
    if(target){
      focusFieldEnd(target);
      typingActive=true;
    }
  }else{
    typingActive=false;
  }
  window.scrollTo(0,savedY);
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(function(){window.scrollTo(0,savedY)});
}
function nextEmpty(){
  for(var d=1;d<=ORDER.length;d++){var i=(cursor+d)%ORDER.length;if(emptyKeys(ORDER[i]).length){go(i,false);return}}
  toast('Every student is complete.');
}

/* ----- all students ----- */
function drawList(){
  renderedColsKey=null;
  var h='<div class="sec search-wrap"><span class="search-ic">'+IC_SEARCH+'</span><input class="inp" id="q" type="text" autocomplete="off" placeholder="Search name, father name, or roll #"><button class="search-clr" id="qClr" type="button" aria-label="Clear search">'+IC_X+'</button></div>';
  if(editable)h+='<div class="flt-bar"><button data-flt="all" type="button">All</button><button data-flt="need" type="button">Empty</button><button data-flt="chg" type="button">Edited</button></div>';
  if(ALLOW)h+='<div class="nav"><button class="btn main grow" id="bAdd" type="button">+ Add student</button></div>';
  h+='<div class="card list-card" id="rows"></div>';
  mainEl.innerHTML=h;
  var qEl=document.getElementById('q');qEl.value=query;
  document.getElementById('qClr').classList.toggle('show',!!query);
  drawRows();
}
function drawRows(){
  Array.prototype.forEach.call(mainEl.querySelectorAll('[data-flt]'),function(b){b.classList.toggle('on',b.getAttribute('data-flt')===filter)});
  var h='';
  ORDER.forEach(function(s,i){
    var e=emptyKeys(s);
    if(query){var hay=(nameOf(s)+' '+String(cur(s,'rollNo'))+' '+String(cur(s,'fatherName'))).toLowerCase();if(hay.indexOf(query)<0)return}
    if(filter==='need'&&!e.length)return;
    if(filter==='chg'&&!isChanged(s))return;
    var sub=COLS.filter(function(f){return f.k!=='name'&&f.k!=='rollNo'&&CFG.fields[f.k]==='show'}).map(function(f){var v=String(cur(s,f.k)||'').trim();return v?esc(f.l)+': '+esc(v):''}).filter(Boolean).join(' · ');
    h+='<button class="row'+((DUP[s.id]||BLANK[s.id])?' bad':'')+'" data-i="'+i+'" type="button">'
      +'<span class="r num">'+(s.isNew?'New':esc(String(cur(s,'rollNo')||'').trim()||(hasRoll?'—':(i+1))))+'</span>'
      +'<span class="m"><div class="n">'+esc(nameOf(s))+'</div>'
      +(sub?'<div class="s">'+sub+'</div>':'')
      +(editable?'<div class="st '+(e.length?'need':'ok')+'">'+(e.length?'Empty: '+e.map(function(k){return esc(LABEL[k])}).join(', '):'Complete')+'</div>':'')
      +'</span>'
      +(isChanged(s)?'<span class="chg-txt">Edited</span>':'')
      +'</button>';
  });
  document.getElementById('rows').innerHTML=h||'<div class="empty">No matching students.</div>';
}

function setView(v){
  if(view==='one'&&v!=='one')oneScrollY=window.scrollY||window.pageYOffset||0;
  view=v;
  var a=document.getElementById('tOne'),b=document.getElementById('tList');
  if(a){a.classList.toggle('on',v==='one');b.classList.toggle('on',v==='list')}
  if(v==='one'){
    drawOne(true);
    if(oneScrollY!==null){
      var y=oneScrollY;
      window.scrollTo(0,y);
      if(typeof requestAnimationFrame==='function')requestAnimationFrame(function(){window.scrollTo(0,y)});
    }
  }else{
    typingActive=false;
    drawList();
  }
}

/* ----- events ----- */
app.addEventListener('focusin',function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-k'))typingActive=true;
});
app.addEventListener('focusout',function(e){
  var t=e.target;
  if(!t||!t.getAttribute||!t.getAttribute('data-k'))return;
  if(navPressing)return;
  setTimeout(function(){
    if(!navPressing&&!isEditingField())typingActive=false;
  },0);
});
app.addEventListener('mousedown',function(e){
  var c=e.target.closest&&e.target.closest('button');
  if(c&&(c.id==='bNext'||c.id==='bPrev'||c.id==='bEmpty')){
    markNavPress();
    e.preventDefault();
  }
});
app.addEventListener('pointerdown',function(e){
  var c=e.target.closest&&e.target.closest('button');
  if(c&&(c.id==='bNext'||c.id==='bPrev'||c.id==='bEmpty')){
    markNavPress();
    if(e.pointerType!=='touch')e.preventDefault();
  }
});
app.addEventListener('touchstart',function(e){
  var c=e.target.closest&&e.target.closest('button');
  if(c&&(c.id==='bNext'||c.id==='bPrev'||c.id==='bEmpty'))markNavPress();
},{passive:true});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){
    query=t.value.trim().toLowerCase();
    var clr=document.getElementById('qClr');if(clr)clr.classList.toggle('show',!!t.value);
    drawRows();return;
  }
  if(t.id==='from'){from=one(t.value);persist();return}
  if(t.getAttribute('data-k')&&view==='one'){
    var s=ORDER[cursor],k=t.getAttribute('data-k');
    var v2=(k==='address'||k==='notes')?String(t.value).replace(/\s*[\r\n]+\s*/g,' '):one(t.value);
    setVal(s,k,v2);persist();computeIssues();updateProgress();refreshOne();
  }
});
app.addEventListener('keydown',function(e){
  var t=e.target;
  if((t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA')||e.key!=='Enter')return;
  var k=t.getAttribute('data-k');
  if(!k)return;
  e.preventDefault();
  var cc=colsFor(ORDER[cursor]);
  var i=cc.map(function(f){return f.k}).indexOf(k);
  if(i<cc.length-1){var n=document.getElementById('e_'+cc[i+1].k);if(n)focusFieldEnd(n)}
  else if(cursor<ORDER.length-1)go(cursor+1,true);
  else{typingActive=false;t.blur()}
});
app.addEventListener('click',function(e){
  var c=e.target.closest&&e.target.closest('button');if(!c)return;
  if(c.id==='tOne')setView('one');
  else if(c.id==='tList')setView('list');
  else if(c.id==='bPrev')go(cursor-1,false);
  else if(c.id==='bNext')go(cursor+1,false);
  else if(c.id==='bEmpty')nextEmpty();
  else if(c.id==='bAdd')addStudent();
  else if(c.id==='bDel')removeNew();
  else if(c.id==='qClr'){var q=document.getElementById('q');if(q){q.value='';query='';c.classList.remove('show');drawRows();q.focus()}}
  else if(c.hasAttribute('data-rst')){
    var rk=c.getAttribute('data-rst'),rs=ORDER[cursor];
    if(rs){var ov=rs[rk]==null?'':String(rs[rk]);setVal(rs,rk,ov);var el=document.getElementById('e_'+rk);if(el)el.value=ov;persist();computeIssues();updateProgress();refreshOne();}
  }
  else if(c.hasAttribute('data-flt')){filter=c.getAttribute('data-flt');drawRows()}
  else if(c.hasAttribute('data-i')){cursor=parseInt(c.getAttribute('data-i'),10);if(editable){setView('one')}}
});
var fromEl=document.getElementById('from');if(fromEl)fromEl.value=from;

/* ----- add / remove new students ----- */
function addStudent(){
  var id='new_'+(++newSeq);
  var o={id:id,isNew:true};
  STU.push(o);byId[id]=o;ORDER.push(o);addedIds.push(id);
  persist();computeIssues();updateProgress();
  cursor=ORDER.length-1;
  if(view!=='one')setView('one');else drawOne(false);
  var t=document.getElementById('e_name');
  if(t){focusFieldEnd(t);typingActive=true}
}
function removeNew(){
  var s=ORDER[cursor];if(!s||!s.isNew)return;
  if(!confirm('Remove this new student?'))return;
  STU.splice(STU.indexOf(s),1);ORDER.splice(cursor,1);delete byId[s.id];delete edits[s.id];
  addedIds=addedIds.filter(function(x){return x!==s.id});
  if(cursor>=ORDER.length)cursor=Math.max(0,ORDER.length-1);
  persist();computeIssues();updateProgress();
  if(view==='one')drawOne();else drawList();
}

/* ---------- print ---------- */
function printNow(){
  var P=CFG.print;
  if(!P||!P.header){toast('Print is not available in this file.');return}
  var ORD=['rollNo','admissionNo','name','fatherName'],PC=COLS.slice().sort(function(a,b){var x=ORD.indexOf(a.k),y=ORD.indexOf(b.k);return (x<0?9:x)-(y<0?9:y)});
  var W={rollNo:8,admissionNo:11,name:22.5,fatherName:22.5},opt=[],tot=0;
  PC.forEach(function(f){if(!W[f.k])opt.push(f)});
  var optW=opt.length?36/opt.length:0;
  PC.forEach(function(f){tot+=W[f.k]||optW});
  function w(f){return ((W[f.k]||optW)*100/tot).toFixed(2)}
  function cell(s,f){
    var v=cur(s,f.k),t=esc(v&&String(v).trim()?v:'\u2014');
    if(f.k==='rollNo')return '<td class="center font-mono font-bold">'+t+'</td>';
    if(f.k==='admissionNo')return '<td class="center font-mono">'+t+'</td>';
    if(f.k==='name'||f.k==='fatherName')return '<td><span class="cg-fit">'+t+'</span></td>';
    if(f.k==='phone')return '<td class="center">'+t+'</td>';
    if(f.k==='notes')return '<td class="cg-nocap">'+t+'</td>';
    return '<td>'+t+'</td>';
  }
  var rows=sorted().map(function(s){return '<tr>'+PC.map(function(f){return cell(s,f)}).join('')+'</tr>'}).join('');
  var html='<div class="print-sheet">'+P.header+'<table><thead><tr>'
   +PC.map(function(f){return '<th style="width:'+w(f)+'%">'+esc(f.l)+'</th>'}).join('')
   +'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+PC.length+'" class="center">No students</td></tr>')+'</tbody></table></div>';
  var pa=document.getElementById('printArea');
  pa.className=P.caps?'caps-on':'';
  pa.style.setProperty('--mult',P.mult||1);
  pa.innerHTML=html;
  var st=document.getElementById('pgstyle');if(st)st.remove();
  st=document.createElement('style');st.id='pgstyle';st.media='print';
  st.textContent=P.css+'\n@page{size:A4 portrait;margin:12mm}';
  document.head.appendChild(st);
  setTimeout(function(){window.print()},50);
}
document.getElementById('bPrint').addEventListener('click',printNow);

/* ---------- save copy / unified 3-tier Android share ---------- */
function download(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
}
function copyText(txt,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){cb(true)},function(){legacyCopy(txt,cb)});
  }else legacyCopy(txt,cb);
}
function legacyCopy(txt,cb){
  var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{ta.setSelectionRange(0,txt.length)}catch(e){}
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();cb(ok);
}
function workBlock(){
  return JSON.stringify({revision:revision,savedAt:savedAt,from:from,edits:edits,added:addedIds}).replace(/</g,'\\u003c');
}
function saveCopy(){
  revision++;savedAt=Date.now();persist();
  var html=SRC.replace(/(<script id="cg-work" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+workBlock()+b});
  download(new Blob([html],{type:'text/html'}),BASE+'.html');
  toast('Offline copy saved. Open it anytime to continue.');
}
function returnObj(){
  var ch={},n=0;
  Object.keys(edits).forEach(function(id){
    var s=byId[id];if(!s||s.isNew)return;
    var o={};
    Object.keys(edits[id]).forEach(function(k){
      if(CFG.fields[k]!=='edit')return;
      o[k]={from:s[k]==null?'':String(s[k]),to:edits[id][k]};n++;
    });
    if(Object.keys(o).length)ch[id]=o;
  });
  var added=[];
  STU.forEach(function(s){
    if(!s.isNew)return;
    var o={tid:s.id};addCols.forEach(function(f){o[f.k]=String(cur(s,f.k)||'').trim()});
    added.push(o);
  });
  return {app:'classgrid-collect-return',v:1,kind:CFG.kind||'students',requestId:CFG.requestId,revision:revision+1,savedAt:Date.now(),
    from:from,className:CFG.className||'',fields:CFG.fields,count:n+added.length,changes:ch,added:added,addKeys:addCols.map(function(f){return f.k})};
}
function formatPayload(obj){
  var hdr='ClassGrid Return — Student Details'+(obj.className?' ('+obj.className+')':'')
    +'\nFrom: '+(obj.from||'Teacher')+' · '+obj.count+' entr'+(obj.count===1?'y':'ies')
    +'\n---\n';
  return hdr+JSON.stringify(obj);
}
function guard(){
  computeIssues();
  if(CURISSUES){toast('Please fix the highlighted errors first.');return false}
  return true;
}

var lastShare=null;
function openShareSheet(payload,fileName,summary,reason){
  lastShare={payload:payload,fileName:fileName,summary:summary};
  document.getElementById('shSub').textContent=summary;
  document.getElementById('shNote').textContent=reason||'Choose how you want to send your completed form back:';
  var fb=document.getElementById('shFb');fb.classList.remove('show');fb.textContent='';
  var waTooBig=encodeURIComponent(payload).length>6000;
  var waBtn=document.getElementById('shWa'),waDesc=document.getElementById('shWaDesc');
  waBtn.disabled=waTooBig;
  waDesc.textContent=waTooBig?'Too large for direct WhatsApp text — use Copy text or Save .txt below':'Opens WhatsApp with your entries ready to send';
  document.getElementById('shareBg').classList.add('open');
}
function closeShareSheet(){document.getElementById('shareBg').classList.remove('open')}
document.getElementById('shClose').addEventListener('click',closeShareSheet);
document.getElementById('shareBg').addEventListener('click',function(e){if(e.target===this)closeShareSheet()});
document.getElementById('shWa').addEventListener('click',function(){
  if(!lastShare)return;
  var a=document.createElement('a');
  a.href='https://wa.me/?text='+encodeURIComponent(lastShare.payload);
  a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
});
document.getElementById('shCopy').addEventListener('click',function(){
  if(!lastShare)return;
  copyText(lastShare.payload,function(ok){
    var fb=document.getElementById('shFb');
    fb.textContent=ok?'Copied! Open WhatsApp and paste it to your coordinator.':'Could not copy automatically. Tap Save .txt file below.';
    fb.classList.add('show');
  });
});
document.getElementById('shTxt').addEventListener('click',function(){
  if(!lastShare)return;
  download(new Blob([lastShare.payload],{type:'text/plain;charset=utf-8'}),lastShare.fileName);
  var fb=document.getElementById('shFb');
  fb.textContent='Saved '+lastShare.fileName+' to Downloads. Attach that .txt file in WhatsApp to send.';
  fb.classList.add('show');
});

async function send(forceSheet){
  if(!guard())return;
  var obj=returnObj();
  if(!obj.count&&!confirm('You have not changed anything. Send anyway?'))return;
  revision=obj.revision;savedAt=obj.savedAt;persist();
  var payload=formatPayload(obj);
  var fileName=BASE+'_rev'+obj.revision+'.txt';
  var title='Student details'+(CFG.className?' ('+CFG.className+')':'')+' from '+(from||'teacher');
  var summary=(CFG.className||'Class')+' · '+(from||'Teacher')+' · '+obj.count+' entr'+(obj.count===1?'y':'ies');
  if(!forceSheet&&typeof navigator!=='undefined'&&navigator.share){
    try{
      var file=new File([payload],fileName,{type:'text/plain'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:title,text:summary});
        toast('Shared.');
        return;
      }
    }catch(e){if(e&&e.name==='AbortError')return}
    if(payload.length<=28000){
      try{
        await navigator.share({title:title,text:payload});
        toast('Shared.');
        return;
      }catch(e){if(e&&e.name==='AbortError')return}
    }
  }
  openShareSheet(payload,fileName,summary,forceSheet?'Choose how you want to send your completed form back:':'Your browser blocked the system share menu on this offline file. Choose how to send it back:');
}

var bd=document.getElementById('bSend');if(bd)bd.addEventListener('click',function(){send(false)});

if(editable){
  var more=document.getElementById('more');
  more.innerHTML='<button class="tlink" id="bOpts" type="button">WhatsApp / Copy / .txt</button>'
    +'<button class="tlink" id="bSave" type="button">Save offline copy</button>'
    +'<button class="tlink" id="bReset" type="button">Reset my edits</button>';
  document.getElementById('bOpts').addEventListener('click',function(){send(true)});
  document.getElementById('bSave').addEventListener('click',saveCopy);
  document.getElementById('bReset').addEventListener('click',function(){
    if(!changeCount()&&!addedIds.length)return;
    if(!confirm('Undo all your changes in this file?'))return;
    if(addedIds.length){
      addedIds.forEach(function(id){delete byId[id]});
      STU=STU.filter(function(s){return !s.isNew});
      ORDER=ORDER.filter(function(s){return !s.isNew});
      addedIds=[];
      if(cursor>=ORDER.length)cursor=Math.max(0,ORDER.length-1);
    }
    edits={};persist();computeIssues();updateProgress();setView(view);toast('Edits cleared.');
  });
}
computeIssues();updateProgress();setView(view);
})();
</script>
