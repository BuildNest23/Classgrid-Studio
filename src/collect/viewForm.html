<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class Copy — ClassGrid</title>
<style>
:root{
  --bg:#f5f5f4;--card:#ffffff;--sub:#fafaf9;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--line2:#d6d3d1;
  --pri:#991b1b;--pri-h:#b91c1c;--pri-s:#fef2f2;--pri-l:#fecaca;
  --ok:#15803d;--ok-s:#f0fdf4;--ok-l:#bbf7d0;
  --warn:#b45309;--warn-s:#fffbeb;--warn-l:#fde68a;
  --sh:0 1px 2px rgba(28,25,23,.05);
  --sh-lg:0 16px 40px rgba(28,25,23,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09;--card:#1c1917;--sub:#161412;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--line2:#44403c;
    --pri:#dc2626;--pri-h:#ef4444;--pri-s:#2a1212;--pri-l:#7f1d1d;
    --ok:#4ade80;--ok-s:#0c2616;--ok-l:#166534;
    --warn:#fbbf24;--warn-s:#291c09;--warn-l:#92400e;
    --sh:none;--sh-lg:0 20px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a09;--card:#1c1917;--sub:#161412;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--line2:#44403c;
  --pri:#dc2626;--pri-h:#ef4444;--pri-s:#2a1212;--pri-l:#7f1d1d;
  --ok:#4ade80;--ok-s:#0c2616;--ok-l:#166534;
  --warn:#fbbf24;--warn-s:#291c09;--warn-l:#92400e;
  --sh:none;--sh-lg:0 20px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#printArea{display:none}

.topbar{position:sticky;top:0;z-index:30;height:52px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;font-weight:800;font-size:12px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;flex:none}
.tb-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.ro-txt{font-size:12px;color:var(--mute);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--line)}

.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.sec{margin-top:12px}

.head{padding:14px 16px;display:flex;gap:14px;align-items:center}
.head img{width:48px;height:48px;object-fit:contain;border-radius:10px;flex:none}
.head-txt{min-width:0;flex:1}
.head h1{margin:0;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.head .meta{color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.head .kicker{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:2px}
.note-box{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:var(--pri-s);border:1px solid var(--pri-l);font-size:13.5px;white-space:pre-wrap;line-height:1.45}
.note-lbl{font-size:11.5px;font-weight:700;color:var(--pri);display:block;margin-bottom:2px}

/* Segmented tabs */
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-top:12px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:0 10px;white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--pri);color:#fff}

/* Summary KPI bar */
.kpi{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi>div{background:var(--card);padding:10px 14px}
.kpi .kl{font-size:11.5px;color:var(--mute);font-weight:600}
.kpi .kv{font-size:18px;font-weight:700;margin-top:2px;line-height:1.2}
.kpi .kv.ok{color:var(--ok)}
.kpi .kv.pri{color:var(--pri)}

/* Controls */
.controls{display:grid;gap:10px;margin-top:12px}
@media (min-width:680px){.controls.two{grid-template-columns:1fr 260px}}
.search-wrap{position:relative}
.inp,.sel{width:100%;min-height:44px;padding:0 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;display:block}
.inp:focus,.sel:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
.search-wrap input{padding-left:38px;padding-right:42px}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;display:flex}
.search-clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:8px;display:none;align-items:center;justify-content:center}
.search-clr.show{display:flex}

/* Scrollable table with sticky Roll & Name columns */
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.tbl th{background:var(--sub);color:var(--mute);text-align:left;padding:10px 10px;font-size:12px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 10px;border-top:1px solid var(--line);vertical-align:middle;background:var(--card)}
.tbl tbody tr:first-child td{border-top:0}
.tbl tbody tr:hover td{background:var(--sub)}
.tbl td.c,.tbl th.c{text-align:center}
.tbl td.roll{min-width:56px;font-weight:700;color:var(--mute);position:sticky;left:0;z-index:2;border-right:1px solid var(--line)}
.tbl th.roll{position:sticky;left:0;z-index:3;border-right:1px solid var(--line)}
.tbl td.nm{min-width:130px;max-width:210px;font-weight:600;position:sticky;left:56px;z-index:2;border-right:1px solid var(--line)}
.tbl th.nm{position:sticky;left:56px;z-index:3;border-right:1px solid var(--line)}
.tbl .fail{color:var(--pri);font-weight:700}
.tbl .pass{color:var(--ok);font-weight:700}
.legend{margin-top:8px;font-size:12.5px;color:var(--mute)}
.empty{padding:32px 16px;text-align:center;color:var(--mute);font-size:14px}

/* Bottom bar */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .12s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--pri);border-color:var(--pri);color:#fff;flex:1}
.btn.main:hover{background:var(--pri-h)}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:1080px;margin:0 auto;display:flex;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92%;box-shadow:var(--sh-lg);text-align:center}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script id="cg-config" type="application/json">{}</script>
<script>
(function(){
'use strict';
function readJSON(id){try{return JSON.parse(document.getElementById(id).textContent||'{}')||{}}catch(e){return {}}}
var CFG=readJSON('cg-config'),app=document.getElementById('app');

var THEME_KEY='cg-qf-theme';
function applyTheme(t){
  if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
try{applyTheme(localStorage.getItem(THEME_KEY)||'')}catch(e){}
function isDark(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t)return t==='dark';
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
}
function toggleTheme(){
  var next=isDark()?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  updateThemeIcon();
}

if(!CFG||CFG.app!=='classgrid-collect'||CFG.kind!=='view'){
  app.innerHTML='<div class="wrap"><div class="card empty">This file has no class data. Ask your coordinator for a new copy.</div></div>';
  return;
}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var STU=CFG.students||[],COLS=CFG.studentCols||[],RES=CFG.results||[],ATT=CFG.attendance||null;
var tabs=[['students','Students']];
if(RES.length)tabs.push(['results','Results']);
if(ATT&&ATT.months.length)tabs.push(['att','Attendance']);
var tab='students',query='',asm=RES.length?0:-1,month='all';

function toast(m){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove()},2800);
}
function dt(ms){try{return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function monthName(k){var p=k.split('-');try{return new Date(+p[0],+p[1]-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}catch(e){return k}}

var IC_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>';
var IC_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var IC_SEARCH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
var IC_X='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
var IC_PRINT='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>';

var metaLine=[CFG.className?'Class '+CFG.className:'',CFG.inchargeName?'Incharge: '+CFG.inchargeName:'',CFG.academicYear||''].filter(Boolean).join(' · ');

app.innerHTML='<header class="topbar"><div class="topbar-in">'
 +'<div class="brand"><span class="mark">CG</span><span class="tb-title">'+esc(CFG.className?CFG.className+' · Class Copy':'Class Copy')+'</span></div>'
 +'<div class="tb-right"><span class="ro-txt">Read-only</span><button class="icon-btn" id="bTheme" type="button" aria-label="Toggle theme"></button></div>'
 +'</div></header>'
 +'<div class="wrap">'
 +'<section class="card"><div class="head">'
 +(CFG.logo?'<img alt="" src="'+esc(CFG.logo)+'">':'')
 +'<div class="head-txt"><div class="kicker">Class snapshot · '+esc(dt(CFG.createdAt))+'</div><h1>'+esc(CFG.schoolName||'School')+'</h1>'
 +(metaLine?'<div class="meta">'+esc(metaLine)+'</div>':'')
 +'</div></div>'
 +(CFG.note?'<div class="note-box"><span class="note-lbl">Note</span>'+esc(CFG.note)+'</div>':'')
 +'</section>'
 +'<div id="tabs"></div>'
 +'<div id="kpi"></div>'
 +'<div class="controls" id="ctrlWrap">'
 +'<div class="search-wrap"><span class="search-ic">'+IC_SEARCH+'</span><input class="inp" id="q" type="text" autocomplete="off" placeholder="Search name, father name, or roll #"><button class="search-clr" id="qClr" type="button" aria-label="Clear search">'+IC_X+'</button></div>'
 +'<div id="ctl"></div>'
 +'</div>'
 +'<div id="body"></div>'
 +'</div>'
 +'<div class="foot"><div class="foot-in"><button class="btn main" id="bPrint" type="button">'+IC_PRINT+'<span>Print this view</span></button></div></div>';

function updateThemeIcon(){var b=document.getElementById('bTheme');if(b)b.innerHTML=isDark()?IC_SUN:IC_MOON}
updateThemeIcon();
document.getElementById('bTheme').addEventListener('click',toggleTheme);

function rows(){
  if(!query)return STU;
  return STU.filter(function(s){return (String(s.name)+' '+String(s.rollNo)+' '+String(s.fatherName||'')).toLowerCase().indexOf(query)>=0});
}
function rollT(s){return String(s.rollNo||'').trim()||'—'}
function attOf(id){
  var m=(ATT.rows[id]||{}),p=0,a=0,l=0;
  Object.keys(m).forEach(function(k){if(month==='all'||k===month){p+=m[k][0];a+=m[k][1];l+=m[k][2]}});
  var tot=p+a+l;return {p:p,a:a,l:l,pct:tot?Math.round(p*1000/tot)/10:null};
}
function resRow(r,id){var x=r.rows[id];return x||null}

function model(){
  var rs=rows();
  if(tab==='students'){
    var cols=[{k:'rollNo',l:'Roll #'},{k:'name',l:'Name'},{k:'admissionNo',l:'Adm. No'},{k:'fatherName',l:'Father Name'}].concat(COLS);
    return {title:'Student List',cols:cols.map(function(c){return {l:c.l,k:c.k}}),rows:rs.map(function(s){return cols.map(function(c){var v=c.k==='rollNo'?rollT(s):(String(s[c.k]==null?'':s[c.k]).trim()||'—');return {t:v}})})};
  }
  if(tab==='results'){
    var a=RES[asm],cols2=[{l:'Roll #',k:'rollNo'},{l:'Name',k:'name'}];
    a.subjects.forEach(function(x){cols2.push({l:x.name+' ('+x.max+')',k:'s'})});
    cols2.push({l:'Total ('+a.totalMax+')',k:'t'},{l:'%',k:'p'},{l:'Result',k:'r'},{l:'Rank',k:'k'});
    var out=rs.map(function(s){
      var x=resRow(a,s.id),row=[{t:rollT(s)},{t:s.name||'—'}];
      a.subjects.forEach(function(sb){var v=x?x.marks[sb.id]:'';var fail=false;if(v==='A')fail=true;else if(v!==''&&v!=null)fail=parseFloat(v)<sb.max*a.passPercent/100;row.push({t:v==null?'':v,f:fail})});
      var has=x&&x.has;
      row.push({t:has?x.total:'—'},{t:has?x.pct+'%':'—'},{t:has?(x.result==='PASS'?'Pass':'Fail')+(x.manual?' *':''):'—',c:has?(x.result==='PASS'?'pass':'fail'):''},{t:has&&x.rank?x.rank:'—'});
      return row;
    });
    return {title:a.name+' - Result',info:'Pass mark: '+a.passPercent+'%',cols:cols2,rows:out};
  }
  var cols3=[{l:'Roll #',k:'rollNo'},{l:'Name',k:'name'},{l:'Present',k:'ap'},{l:'Absent',k:'aa'},{l:'Leave',k:'al'},{l:'Present %',k:'apct'}];
  return {title:'Attendance - '+(month==='all'?'All days':monthName(month)),cols:cols3,rows:rs.map(function(s){var o=attOf(s.id);return [{t:rollT(s)},{t:s.name||'—'},{t:o.p},{t:o.a},{t:o.l},{t:o.pct==null?'—':o.pct+'%'}]})};
}

function drawKpi(){
  var kEl=document.getElementById('kpi');
  if(tab==='students'){
    kEl.innerHTML='<div class="kpi num"><div><div class="kl">Students</div><div class="kv">'+STU.length+'</div></div><div><div class="kl">Columns</div><div class="kv">'+(4+COLS.length)+'</div></div></div>';
    return;
  }
  if(tab==='results'){
    var a=RES[asm],pass=0,fail=0,scored=0;
    STU.forEach(function(s){var x=resRow(a,s.id);if(x&&x.has){scored++;if(x.result==='PASS')pass++;else fail++}});
    var rate=scored?Math.round(pass*100/scored)+'%':'—';
    kEl.innerHTML='<div class="kpi num"><div><div class="kl">Scored</div><div class="kv">'+scored+'/'+STU.length+'</div></div><div><div class="kl">Passed</div><div class="kv ok">'+pass+'</div></div><div><div class="kl">Failed</div><div class="kv pri">'+fail+'</div></div><div><div class="kl">Pass rate</div><div class="kv">'+rate+'</div></div></div>';
    return;
  }
  var tp=0,ta=0,tl=0;
  STU.forEach(function(s){var o=attOf(s.id);tp+=o.p;ta+=o.a;tl+=o.l});
  var tot=tp+ta+tl,pr=tot?Math.round(tp*1000/tot)/10+'%':'—';
  kEl.innerHTML='<div class="kpi num"><div><div class="kl">Present</div><div class="kv ok">'+tp+'</div></div><div><div class="kl">Absent</div><div class="kv pri">'+ta+'</div></div><div><div class="kl">Leave</div><div class="kv">'+tl+'</div></div><div><div class="kl">Rate</div><div class="kv">'+pr+'</div></div></div>';
}

var CEN={rollNo:1,admissionNo:1,phone:1,s:1,t:1,p:1,k:1,r:1,ap:1,aa:1,al:1,apct:1};
function draw(){
  var tEl=document.getElementById('tabs');
  tEl.innerHTML=tabs.length>1?'<div class="seg">'+tabs.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" data-tab="'+t[0]+'" type="button">'+t[1]+'</button>'}).join('')+'</div>':'';
  var c='';
  if(tab==='results'&&RES.length>1)c='<select class="sel" id="asm" aria-label="Assessment">'+RES.map(function(a,i){return '<option value="'+i+'"'+(i===asm?' selected':'')+'>'+esc(a.name)+'</option>'}).join('')+'</select>';
  if(tab==='att'){c='<select class="sel" id="mon" aria-label="Month"><option value="all">All months</option>'+ATT.months.map(function(k){return '<option value="'+k+'"'+(k===month?' selected':'')+'>'+esc(monthName(k))+'</option>'}).join('')+'</select>'}
  document.getElementById('ctl').innerHTML=c;
  document.getElementById('ctrlWrap').className='controls'+(c?' two':'');
  drawKpi();
  var m=model();
  var h='<div class="tw"><table class="tbl num"><thead><tr>'+m.cols.map(function(col){
    var cl=[];if(col.k==='rollNo')cl.push('roll c');else if(col.k==='name')cl.push('nm');else if(CEN[col.k])cl.push('c');
    return '<th'+(cl.length?' class="'+cl.join(' ')+'"':'')+'>'+esc(col.l)+'</th>';
  }).join('')+'</tr></thead><tbody>';
  m.rows.forEach(function(r){
    h+='<tr>'+r.map(function(cell,i){
      var k=m.cols[i].k,cl=[];
      if(k==='rollNo')cl.push('roll c');
      else if(k==='name')cl.push('nm');
      else if(CEN[k])cl.push('c');
      if(cell.f)cl.push('fail');
      if(cell.c)cl.push(cell.c);
      return '<td'+(cl.length?' class="'+cl.join(' ')+'"':'')+'>'+esc(cell.t)+'</td>';
    }).join('')+'</tr>';
  });
  h+=m.rows.length?'':'<tr><td colspan="'+m.cols.length+'" class="c empty">No matching students.</td></tr>';
  document.getElementById('body').innerHTML=h+'</tbody></table></div>'
    +(tab==='results'?'<div class="legend">Red marks are below the pass mark ('+RES[asm].passPercent+'%) or absent.'+(RES[asm].rows&&Object.keys(RES[asm].rows).some(function(k){return RES[asm].rows[k].manual})?' * = passed manually.':'')+'</div>':'');
}

app.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-tab')){tab=b.getAttribute('data-tab');draw()}
  else if(b.id==='qClr'){var q=document.getElementById('q');q.value='';query='';b.classList.remove('show');draw();q.focus()}
});
app.addEventListener('change',function(e){
  if(e.target.id==='asm'){asm=+e.target.value;draw()}
  if(e.target.id==='mon'){month=e.target.value;draw()}
});
app.addEventListener('input',function(e){
  if(e.target.id==='q'){

function planPrintCols(specs,mult,caps){
  var cv=document.createElement('canvas'),cx=cv.getContext('2d'),pxToMm=25.4/96;
  var fPx=9.5*mult*96/72,hPx=8.5*mult*96/72,pad=2.8*mult+0.5,fam='Arial,Helvetica,sans-serif';
  function tw(t,f){if(!cx)return String(t||'').length*2.1;cx.font=f;return cx.measureText(String(t||'')).width*pxToMm}
  function blank(v){var s=String(v==null?'':v).trim();return !s||s==='\u2014'||s==='-'||s==='\u2013'}
  var ms=specs.map(function(c){
    var up=caps&&!c.nocap,hl=up?String(c.l||'').toUpperCase():String(c.l||'');
    var hm=tw(hl,'700 '+hPx+'px '+fam)+pad+1.4;
    var hwm=hl.split(/\s+/).reduce(function(m,w){return Math.max(m,tw(w,'700 '+hPx+'px '+fam))},0)+pad+1.2;
    var vals=c.vals.map(function(v){return String(v==null?'':v).trim()}).filter(function(v){return !blank(v)});
    if(!vals.length){var cm=Math.max(9.5,Math.min(hm,Math.max(hwm,hm*0.85)));return {empty:true,min:Math.max(8,Math.min(cm,hwm)),nat:cm,max:Math.max(cm+2,16),w:0,sl:true}}
    var ws=[],lw=0,fw=(c.kind==='index'||c.kind==='status')?700:400,vf=fw+' '+fPx+'px '+fam;
    vals.forEach(function(v){var t=up?v.toUpperCase():v;ws.push(tw(t,vf)+pad+1.4);t.split(/\s+/).forEach(function(p){if(p)lw=Math.max(lw,tw(p,vf)+pad+1.2)})});
    ws.sort(function(a,b){return a-b});
    var mx=ws[ws.length-1]||hm,p90=ws[Math.min(ws.length-1,Math.floor((ws.length-1)*0.9))]||mx;
    var sl=c.kind==='index'||c.kind==='code'||c.kind==='phone'||c.kind==='status';
    var mn,nt,wt;
    if(c.kind==='index'){nt=Math.max(hm,Math.min(mx,18));mn=Math.max(8.5,Math.min(nt,14));wt=0.05}
    else if(c.kind==='code'){nt=Math.max(hm,Math.min(mx,28));mn=Math.max(9.5,Math.min(nt,Math.max(hwm,Math.min(p90,22))));wt=0.15}
    else if(c.kind==='phone'){nt=Math.max(hm,Math.min(mx+0.8,36));mn=Math.max(hm,Math.min(mx,30));wt=0.15}
    else if(c.kind==='status'){nt=Math.max(hm,Math.min(mx+1,30));mn=Math.max(hwm,13);wt=0.15}
    else if(c.kind==='name'){nt=Math.max(hm,Math.min(mx,58),Math.min(p90+2,50));mn=Math.max(hwm,Math.min(lw,28),20);wt=1.25}
    else{var tg=mx<=34?mx:Math.max(lw,p90*0.62,mx*0.52);nt=Math.max(hm,Math.min(tg,52));mn=Math.max(hwm,Math.min(lw,26),15);wt=1}
    if(nt<mn)nt=mn;
    return {empty:false,min:mn,nat:nt,w:wt,sl:sl};
  });
  var totNat=ms.reduce(function(s,m){return s+m.nat},0);
  var land=specs.length>=5&&totNat>186*1.03,target=land?277:186;
  var ws=ms.map(function(m){return m.nat}),sum=totNat;
  if(sum<target){
    var ex=target-sum;
    [function(m){return !m.empty&&m.w>=0.5},function(m){return !m.empty},function(){return true}].forEach(function(fn){
      if(ex<=0.05)return;var ix=[];ms.forEach(function(m,i){if(fn(m))ix.push(i)});if(!ix.length)return;
      var twt=ix.reduce(function(s,i){return s+(ms[i].w||0.2)},0);
      ix.forEach(function(i){ws[i]+=ex*(ms[i].w||0.2)/twt});ex=0;
    });
  }else if(sum>target){
    var def=sum-target;
    [function(m){return !m.empty&&!m.sl},function(m){return m.empty},function(m){return !m.empty&&m.sl}].forEach(function(fn){
      if(def<=0.05)return;var slk=0,ix=[];
      ms.forEach(function(m,i){if(fn(m)){var k=Math.max(0,ws[i]-m.min);if(k>0){ix.push(i);slk+=k}}});
      if(slk<=0.01)return;var tk=Math.min(def,slk);
      ix.forEach(function(i){ws[i]-=tk*Math.max(0,ws[i]-ms[i].min)/slk});def-=tk;
    });
    if(def>0.05){var curS=ws.reduce(function(a,b){return a+b},0)||target;ws=ws.map(function(w){return w*target/curS})}
  }
  var sFinal=ws.reduce(function(a,b){return a+b},0)||target;
  return {land:land,pct:ws.map(function(w){return (w*100/sFinal).toFixed(2)})};
}
document.getElementById('bPrint').addEventListener('click',function(){
  var P=CFG.print;if(!P||!P.header){toast('Print is not available in this file.');return}
  var m=model();
  var specs=m.cols.map(function(c,idx){
    var k=c.k;
    var kind=k==='rollNo'||k==='rank'?'index':k==='phone'?'phone':(k==='name'||k==='fatherName')?'name':(k==='res'||k==='status')?'status':(CEN[k]?'code':'text');
    return {l:c.l,kind:kind,nocap:k==='notes'||k==='remark',vals:m.rows.map(function(r){return r[idx]?r[idx].t:''})};
  });
  var lay=planPrintCols(specs,P.mult||1,!!P.caps);
  var head=m.cols.map(function(c,i){return '<th style="width:'+lay.pct[i]+'%">'+esc(c.l)+'</th>'}).join('');
  var body=m.rows.map(function(r){return '<tr>'+r.map(function(c,i){var k=m.cols[i].k,cl=[];
    if(k==='rollNo')cl.push('center font-mono font-bold');else if(CEN[k])cl.push('center');
    if(k==='notes'||k==='remark')cl.push('cg-nocap');
    var inner=(k==='name'||k==='fatherName')?'<span class="cg-fit">'+esc(c.t)+'</span>':(k==='rollNo'||k==='phone'||CEN[k]?'<span class="cg-fit-line">'+esc(c.t)+'</span>':esc(c.t));
    return '<td'+(cl.length?' class="'+cl.join(' ')+'"':'')+(c.f?' style="font-weight:800;text-decoration:underline"':'')+'>'+inner+'</td>'}).join('')+'</tr>'}).join('');
  var hdr=P.headers&&P.headers[tab]?P.headers[tab]:P.header;
  hdr=hdr.replace(/>[^<>]*Student List[^<>]*</,'>'+esc(m.title)+'<');
  var pa=document.getElementById('printArea');
  pa.className=P.caps?'caps-on':'';pa.style.setProperty('--mult',P.mult||1);
  pa.innerHTML='<div class="print-sheet">'+hdr+'<table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  var st=document.getElementById('pgstyle');if(st)st.remove();
  st=document.createElement('style');st.id='pgstyle';st.media='print';
  st.textContent=P.css+'\n.print-sheet,.print-sheet *{box-sizing:border-box}.print-sheet th,.print-sheet td{overflow-wrap:break-word;word-break:break-word;max-width:100%}.print-sheet .cg-fit-line{display:inline-block;max-width:100%;white-space:nowrap}\n@page{size:A4 '+(lay.land?'landscape':'portrait')+';margin:'+(lay.land?'10mm':'12mm')+'}';
  document.head.appendChild(st);
  setTimeout(function(){window.print()},50);
});
draw();
})();
