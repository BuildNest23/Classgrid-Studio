<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marks Entry — ClassGrid</title>
<style>
:root{
  --bg:#f5f5f4;--card:#ffffff;--sub:#fafaf9;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--line2:#d6d3d1;
  --pri:#991b1b;--pri-h:#b91c1c;--pri-s:#fef2f2;--pri-l:#fecaca;
  --ok:#15803d;--ok-s:#f0fdf4;--ok-l:#bbf7d0;
  --warn:#b45309;--warn-s:#fffbeb;--warn-l:#fde68a;
  --chg:#fefce8;--chg-l:#facc15;
  --wa:#15803d;--wa-h:#166534;
  --sh:0 1px 2px rgba(28,25,23,.05);
  --sh-lg:0 16px 40px rgba(28,25,23,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09;--card:#1c1917;--sub:#161412;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--line2:#44403c;
    --pri:#dc2626;--pri-h:#ef4444;--pri-s:#2a1212;--pri-l:#7f1d1d;
    --ok:#4ade80;--ok-s:#0c2616;--ok-l:#166534;
    --warn:#fbbf24;--warn-s:#291c09;--warn-l:#92400e;
    --chg:#29220a;--chg-l:#854d0e;
    --wa:#16a34a;--wa-h:#15803d;
    --sh:none;--sh-lg:0 20px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a09;--card:#1c1917;--sub:#161412;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--line2:#44403c;
  --pri:#dc2626;--pri-h:#ef4444;--pri-s:#2a1212;--pri-l:#7f1d1d;
  --ok:#4ade80;--ok-s:#0c2616;--ok-l:#166534;
  --warn:#fbbf24;--warn-s:#291c09;--warn-l:#92400e;
  --chg:#29220a;--chg-l:#854d0e;
  --wa:#16a34a;--wa-h:#15803d;
  --sh:none;--sh-lg:0 20px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#printArea{display:none}

/* Sticky top bar */
.topbar{position:sticky;top:0;z-index:30;height:52px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:920px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;font-weight:800;font-size:12px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;flex:none}
.tb-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.save-ind{font-size:12px;color:var(--mute);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sub);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--line)}

.wrap{max-width:920px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.sec{margin-top:12px}

.head{padding:14px 16px;display:flex;gap:14px;align-items:center}
.head img{width:48px;height:48px;object-fit:contain;border-radius:10px;flex:none}
.head-txt{min-width:0;flex:1}
.head h1{margin:0;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.head .meta{color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.head .kicker{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:2px}
.note-box{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:var(--pri-s);border:1px solid var(--pri-l);font-size:13.5px;white-space:pre-wrap;line-height:1.45}
.note-lbl{font-size:11.5px;font-weight:700;color:var(--pri);display:block;margin-bottom:2px}

.name-bar{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name-bar label{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.name-bar input{flex:1;min-width:160px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--sub);font-size:15px}
.name-bar input:focus{outline:0;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}

/* Subject switcher */
.subs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:12px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub-btn{min-height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.sub-btn small{font-size:12px;color:var(--mute);font-weight:600}
.sub-btn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sub-btn.on small{color:rgba(255,255,255,.82)}

/* Progress & context */
.prog-card{padding:12px 16px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.prog-top strong{color:var(--ink);font-weight:700}
.smax{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.4}
.smax strong{color:var(--ink)}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s ease-out}

.mx-card{padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-s);border-color:var(--warn-l)}
.mx-card label{font-size:13px;font-weight:600;color:var(--ink);flex:1;min-width:170px}
.mx-card input{width:110px;height:42px;padding:0 12px;border-radius:10px;border:1.5px solid var(--warn-l);background:var(--card);text-align:center;font-weight:700;font-size:16px}
.mx-card input:focus{outline:0;border-color:var(--pri)}

.issues{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--pri-s);border:1px solid var(--pri-l);color:var(--pri);font-weight:600;font-size:13.5px}
.issues:empty{display:none}

/* Search & filter */
.controls{display:grid;gap:10px;margin-top:12px}
@media (min-width:680px){.controls{grid-template-columns:1fr auto;align-items:center}}
.search-wrap{position:relative}
.inp{width:100%;min-height:44px;padding:0 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15.5px;display:block}
.inp:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
.search-wrap input{padding-left:38px;padding-right:42px}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;display:flex}
.search-clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:8px;display:none;align-items:center;justify-content:center}
.search-clr.show{display:flex}

.flt-row{display:flex;gap:8px;align-items:center}
.flt-bar{display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--card);border:1px solid var(--line);flex:1}
.flt-bar button{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:0 10px;white-space:nowrap}
.flt-bar button.on{background:var(--ink);color:var(--card)}
.jump-btn{min-height:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--pri);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.jump-btn:hover{background:var(--pri-s)}

/* Marks rows */
.list-card{margin-top:10px;overflow:hidden}
.mrow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);transition:background .12s}
.mrow:first-child{border-top:0}
.mrow.bad{background:var(--pri-s)}
.mrow .r{min-width:42px;text-align:center;font-weight:700;font-size:13.5px;color:var(--mute);background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:6px 4px;flex:none}
.mrow .m{min-width:0;flex:1}
.mrow .n{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
.mrow .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.mrow .e{color:var(--pri);font-size:12px;font-weight:600;margin-top:2px}
.mrow .e:empty{display:none}
.m-inp{width:82px;height:46px;flex:none;text-align:center;font-weight:700;font-size:17px;border-radius:11px;border:1.5px solid var(--line);background:var(--sub);color:var(--ink);padding:0 6px}
.m-inp:focus{outline:0;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
.m-inp.chg{background:var(--chg);border-color:var(--chg-l)}
.mrow.bad .m-inp{border-color:var(--pri);background:var(--card);color:var(--pri)}
.ab{flex:none;width:44px;height:46px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,color .15s}
.ab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.mrow.t{flex-wrap:wrap}
.mrow.t .m-inp{width:100%;text-align:left;font-size:15px;font-weight:500;padding:0 12px;margin-top:4px}
.empty{padding:32px 16px;text-align:center;color:var(--mute);font-size:14px}

/* Bottom bar */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .12s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.main{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.main:hover:not(:disabled){background:var(--pri-h)}
.btn.ghost{background:var(--sub)}
.text-actions{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px}
.tlink{background:none;border:0;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:8px;min-height:40px}
.tlink:hover{color:var(--ink);background:var(--line)}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:920px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .btn.main{flex:1.4}

/* Share sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(12,10,9,.56);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
@media (min-width:640px){.sheet-bg{align-items:center;padding:16px}}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh-lg);animation:su .18s cubic-bezier(.16,1,.3,1)}
@media (min-width:640px){.sheet{border-radius:20px;padding:18px 20px}}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 12px}
@media (min-width:640px){.grab{display:none}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-head h2{margin:0;font-size:17px;font-weight:700}
.sh-sub{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.4}
.sh-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sub);border:1px solid var(--line);font-size:12.5px;color:var(--mute);line-height:1.45}
.sh-acts{margin-top:14px;display:grid;gap:10px}
.sh-btn{width:100%;min-height:52px;padding:10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--sub);color:var(--ink);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.sh-btn:hover{background:var(--line)}
.sh-btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.sh-btn.wa:hover{background:var(--wa-h)}
.sh-btn.wa .sh-d{color:rgba(255,255,255,.86)}
.sh-btn:disabled{opacity:.5;cursor:not-allowed}
.sh-ic{width:34px;height:34px;border-radius:9px;background:rgba(128,128,128,.12);display:flex;align-items:center;justify-content:center;flex:none}
.sh-btn.wa .sh-ic{background:rgba(255,255,255,.18)}
.sh-t{font-weight:700;font-size:14.5px;line-height:1.2}
.sh-d{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.3}
.sh-fb{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--ok-s);border:1px solid var(--ok-l);color:var(--ok);font-size:13px;font-weight:600;display:none}
.sh-fb.show{display:block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:92%;box-shadow:var(--sh-lg);text-align:center}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script id="cg-config" type="application/json">{}</script>
<script id="cg-work" type="application/json">{}</script>
<script>
(function(){
'use strict';
var SRC='<!doctype html>\n'+document.documentElement.outerHTML;
function readJSON(id){try{return JSON.parse(document.getElementById(id).textContent||'{}')||{}}catch(e){return {}}}
var CFG=readJSON('cg-config'),WORK=readJSON('cg-work');
var app=document.getElementById('app');

var THEME_KEY='cg-qf-theme';
function applyTheme(t){
  if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
try{applyTheme(localStorage.getItem(THEME_KEY)||'')}catch(e){}
function isDark(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t)return t==='dark';
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
}
function toggleTheme(){
  var next=isDark()?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  updateThemeIcon();
}

if(!CFG||CFG.app!=='classgrid-collect'||CFG.kind!=='marks'||!CFG.students||!CFG.subjects||!CFG.subjects.length){
  app.innerHTML='<div class="wrap"><div class="card empty">This file has no marks data. Ask your coordinator for a new form.</div></div>';
  return;
}

var STU=CFG.students,SUBS=CFG.subjects,byId={};STU.forEach(function(s){byId[s.id]=s});
var REM=!!CFG.remarks,ALL=SUBS.slice();
if(REM)ALL.push({id:'_remark',name:'Remarks',max:0,text:true});
var subById={};ALL.forEach(function(x){subById[x.id]=x});
var showFather=!!CFG.showFather;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function one(v){return String(v==null?'':v).replace(/\s*[\r\n]+\s*/g,' ')}
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k)}

var LSKEY='cgc:'+CFG.requestId;
var TEACHER_KEY='cg-qf-teacher';
var edits={},maxes={},from='',revision=0,savedAt=0;
(function(){
  var a=WORK&&WORK.edits?WORK:null,b=null;
  try{b=JSON.parse(localStorage.getItem(LSKEY)||'null')}catch(e){}
  var p=a;if(b&&b.edits&&(!a||(b.savedAt||0)>(a.savedAt||0)))p=b;
  if(p){edits=p.edits||{};maxes=p.maxes||{};from=p.from||'';revision=p.revision||0;savedAt=p.savedAt||0}
  if(!from){try{from=localStorage.getItem(TEACHER_KEY)||''}catch(e){}}
})();
function orig(s,k){return s[k]==null?'':String(s[k])}
function cur(s,k){var e=edits[s.id];return (e&&has(e,k))?e[k]:orig(s,k)}
function setVal(s,k,v){
  var o=orig(s,k);
  if(v===o){if(edits[s.id]){delete edits[s.id][k];if(!Object.keys(edits[s.id]).length)delete edits[s.id]}}
  else{(edits[s.id]=edits[s.id]||{})[k]=v}
}
var saveT=null;
function setSaveInd(txt){var el=document.getElementById('saveInd');if(el)el.textContent=txt}
function persist(){
  setSaveInd('Saving...');
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{
      localStorage.setItem(LSKEY,JSON.stringify({edits:edits,maxes:maxes,from:from,revision:revision,savedAt:Date.now()}));
      if(from)localStorage.setItem(TEACHER_KEY,from);
      setSaveInd('Saved');
    }catch(e){setSaveInd('')}
  },260);
}
function changeCount(){var n=0;Object.keys(edits).forEach(function(id){n+=Object.keys(edits[id]).length});return n}
function mx(x){if(x.text)return 0;if(x.max>0)return x.max;var n=parseInt(maxes[x.id],10);return n>0?n:0}
function norm(v){v=one(v).trim().replace(/,/g,'.');if(/^(a|abs|absent)$/i.test(v))return 'A';return v}
function fin(v){return /^\d+\.$/.test(v)?v.slice(0,-1):v}
function check(v,max){
  if(v===''||v==='A')return '';
  if(!/^\d+\.?\d*$/.test(v))return 'Numbers only, or A for absent.';
  if(max>0&&parseFloat(v)>max)return 'Maximum is '+max+'.';
  return '';
}
function toast(m){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove()},2800);
}
function safeName(s){return String(s||'file').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'file'}
var BASE=safeName((CFG.className||'class')+'_'+(CFG.assessmentName||'marks')+'_'+CFG.requestId);
function sorted(){
  return STU.slice().sort(function(a,b){
    var x=String(a.rollNo||'').trim(),y=String(b.rollNo||'').trim();
    if(!x||!y)return x===y?0:(!x?1:-1);
    return x.localeCompare(y,undefined,{numeric:true});
  });
}
var ORDER=sorted(),sub=SUBS[0].id,filter='all',query='';

var IC_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>';
var IC_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var IC_SEARCH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';

function computeIssues(){

function planPrintCols(specs,mult,caps){
  var cv=document.createElement('canvas'),cx=cv.getContext('2d'),pxToMm=25.4/96;
  var fPx=9.5*mult*96/72,hPx=8.5*mult*96/72,pad=2.6*mult+0.5,fam='Arial,Helvetica,sans-serif';
  function tw(t,f){if(!cx)return String(t||'').length*2.1;cx.font=f;return cx.measureText(String(t||'')).width*pxToMm}
  function blank(v){var s=String(v==null?'':v).trim();return !s||s==='\u2014'||s==='-'||s==='\u2013'}
  var ms=specs.map(function(c){
    var up=caps&&!c.nocap,hl=up?String(c.l||'').toUpperCase():String(c.l||'');
    var hm=tw(hl,'700 '+hPx+'px '+fam)+pad+1.4;
    var hwm=hl.split(/\s+/).reduce(function(m,w){return Math.max(m,tw(w,'700 '+hPx+'px '+fam))},0)+pad+1.2;
    var vals=c.vals.map(function(v){return String(v==null?'':v).trim()}).filter(function(v){return !blank(v)});
    if(!vals.length&&c.kind==='text'){var cm=Math.max(11,Math.min(hm,Math.max(hwm,hm*0.85)));return {empty:true,min:Math.max(9,Math.min(cm,hwm)),nat:cm,max:18,w:0,sl:true}}
    var ws=[],lw=0,vf='400 '+fPx+'px '+fam;
    vals.forEach(function(v){var t=up?v.toUpperCase():v;ws.push(tw(t,vf)+pad+1.4);t.split(/\s+/).forEach(function(p){if(p)lw=Math.max(lw,tw(p,vf)+pad+1.2)})});
    ws.sort(function(a,b){return a-b});
    var mxv=ws.length?ws[ws.length-1]:hm,p90=ws.length?ws[Math.min(ws.length-1,Math.floor((ws.length-1)*0.9))]:hm;
    var sl=c.kind==='index'||c.kind==='code';
    var mn,nt,wt;
    if(c.kind==='index'){nt=Math.max(hm,Math.min(mxv,16));mn=Math.max(8.5,Math.min(nt,13));wt=0.05}
    else if(c.kind==='code'){nt=Math.max(13,Math.min(Math.max(hwm,mxv),26));mn=Math.max(10,Math.min(hwm,18));wt=0.2}
    else if(c.kind==='name'){nt=Math.max(hm,Math.min(mxv,54),Math.min(p90+2,48));mn=Math.max(hwm,Math.min(lw,28),20);wt=1.2}
    else{var tg=mxv<=34?mxv:Math.max(lw,p90*0.62,mxv*0.52);nt=Math.max(hm,Math.min(tg,50));mn=Math.max(hwm,Math.min(lw,26),15);wt=1}
    if(nt<mn)nt=mn;
    return {empty:false,min:mn,nat:nt,w:wt,sl:sl};
  });
  var totNat=ms.reduce(function(s,m){return s+m.nat},0);
  var land=specs.length>=6&&totNat>186*1.03,target=land?277:186;
  var ws=ms.map(function(m){return m.nat}),sum=totNat;
  if(sum<target){
    var ex=target-sum;
    [function(m){return !m.empty&&m.w>=0.5},function(m){return !m.empty},function(){return true}].forEach(function(fn){
      if(ex<=0.05)return;var ix=[];ms.forEach(function(m,i){if(fn(m))ix.push(i)});if(!ix.length)return;
      var twt=ix.reduce(function(s,i){return s+(ms[i].w||0.2)},0);
      ix.forEach(function(i){ws[i]+=ex*(ms[i].w||0.2)/twt});ex=0;
    });
  }else if(sum>target){
    var def=sum-target;
    [function(m){return !m.empty&&!m.sl},function(m){return m.empty},function(m){return !m.empty&&m.sl}].forEach(function(fn){
      if(def<=0.05)return;var slk=0,ix=[];
      ms.forEach(function(m,i){if(fn(m)){var k=Math.max(0,ws[i]-m.min);if(k>0){ix.push(i);slk+=k}}});
      if(slk<=0.01)return;var tk=Math.min(def,slk);
      ix.forEach(function(i){ws[i]-=tk*Math.max(0,ws[i]-ms[i].min)/slk});def-=tk;
    });
    if(def>0.05){var curS=ws.reduce(function(a,b){return a+b},0)||target;ws=ws.map(function(w){return w*target/curS})}
  }
  var sFinal=ws.reduce(function(a,b){return a+b},0)||target;
  return {land:land,pct:ws.map(function(w){return (w*100/sFinal).toFixed(2)})};
}
function printNow(){
  var P=CFG.print;
  if(!P||!P.header){toast('Print is not available in this file.');return}
  var specs=[
    {l:'Roll #',kind:'index',vals:ORDER.map(function(s){return s.rollNo||''})},
    {l:'Name',kind:'name',vals:ORDER.map(function(s){return s.name||''})}
  ];
  if(showFather)specs.push({l:'Father Name',kind:'name',vals:ORDER.map(function(s){return s.fatherName||''})});
  SUBS.forEach(function(x){specs.push({l:x.name,kind:'code',vals:ORDER.map(function(s){return cur(s,x.id)})})});
  if(REM)specs.push({l:'Remarks',kind:'text',nocap:true,vals:ORDER.map(function(s){return cur(s,'_remark')})});
  var lay=planPrintCols(specs,P.mult||1,!!P.caps);
  var ci=0,head='<th style="width:'+lay.pct[ci++]+'%">Roll #</th><th style="width:'+lay.pct[ci++]+'%">Name</th>'+(showFather?'<th style="width:'+lay.pct[ci++]+'%">Father Name</th>':'');
  SUBS.forEach(function(x){head+='<th style="width:'+lay.pct[ci++]+'%">'+esc(x.name)+'<br>('+(mx(x)>0?mx(x):'\u2014')+')</th>'});
  if(REM)head+='<th style="width:'+lay.pct[ci++]+'%">Remarks</th>';
  var rows=ORDER.map(function(s){
    var r='<tr><td class="center font-mono font-bold"><span class="cg-fit-line">'+esc(String(s.rollNo||'').trim()||'\u2014')+'</span></td><td><span class="cg-fit">'+esc(s.name||'\u2014')+'</span></td>'+(showFather?'<td><span class="cg-fit">'+esc(s.fatherName||'\u2014')+'</span></td>':'');
    SUBS.forEach(function(x){r+='<td class="center"><span class="cg-fit-line">'+esc(cur(s,x.id))+'</span></td>'});
    if(REM)r+='<td class="cg-nocap">'+esc(cur(s,'_remark'))+'</td>';
    return r+'</tr>';
  }).join('');
  var pa=document.getElementById('printArea');
  pa.className=P.caps?'caps-on':'';pa.style.setProperty('--mult',P.mult||1);
  pa.innerHTML='<div class="print-sheet">'+P.header+'<table><thead><tr>'+head+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+specs.length+'" class="center">No students</td></tr>')+'</tbody></table></div>';
  var st=document.getElementById('pgstyle');if(st)st.remove();
  st=document.createElement('style');st.id='pgstyle';st.media='print';
  st.textContent=P.css+'\n.print-sheet,.print-sheet *{box-sizing:border-box}.print-sheet th,.print-sheet td{overflow-wrap:break-word;word-break:break-word;max-width:100%}.print-sheet .cg-fit-line{display:inline-block;max-width:100%;white-space:nowrap}\n@page{size:A4 '+(lay.land?'landscape':'portrait')+';margin:'+(lay.land?'10mm':'12mm')+'}';
  document.head.appendChild(st);
  setTimeout(function(){window.print()},50);
}

/* ---------- save / 3-tier Android share ---------- */
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function copyText(txt,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){cb(true)},function(){legacyCopy(txt,cb)});
  }else legacyCopy(txt,cb);
}
function legacyCopy(txt,cb){
  var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{ta.setSelectionRange(0,txt.length)}catch(e){}
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();cb(ok);
}
function workBlock(){return JSON.stringify({revision:revision,savedAt:savedAt,from:from,edits:edits,maxes:maxes}).replace(/</g,'\\u003c')}
function saveCopy(){
  revision++;savedAt=Date.now();persist();
  var html=SRC.replace(/(<script id="cg-work" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+workBlock()+b});
  download(new Blob([html],{type:'text/html'}),BASE+'.html');
  toast('Offline copy saved. Open it anytime to continue.');
}
function returnObj(){
  var ch={},n=0,fields={};
  ALL.forEach(function(x){fields[x.id]='edit'});
  Object.keys(edits).forEach(function(id){
    var s=byId[id];if(!s)return;var o={};
    Object.keys(edits[id]).forEach(function(k){if(!subById[k])return;o[k]={from:orig(s,k),to:subById[k].text?edits[id][k]:fin(edits[id][k])};n++});
    if(Object.keys(o).length)ch[id]=o;
  });
  var mo={};
  SUBS.forEach(function(x){if(x.max>0)return;var v=parseInt(maxes[x.id],10);if(v>0)mo[x.id]={from:'0',to:String(v)}});
  return {app:'classgrid-collect-return',v:1,kind:'marks',requestId:CFG.requestId,revision:revision+1,savedAt:Date.now(),from:from,className:CFG.className||'',
    assessmentId:CFG.assessmentId,assessmentName:CFG.assessmentName||'',subjects:SUBS,fields:fields,count:n+Object.keys(mo).length,changes:ch,maxes:mo};
}
function formatPayload(obj){
  var hdr='ClassGrid Return — '+(obj.assessmentName||'Marks')+(obj.className?' ('+obj.className+')':'')
    +'\nFrom: '+(obj.from||'Teacher')+' · '+obj.count+' entr'+(obj.count===1?'y':'ies')
    +'\n---\n';
  return hdr+JSON.stringify(obj);
}
function guard(){if(computeIssues()){toast('Please fix the invalid marks first.');return false}return true}

var lastShare=null;
function openShareSheet(payload,fileName,summary,reason){
  lastShare={payload:payload,fileName:fileName,summary:summary};
  document.getElementById('shSub').textContent=summary;
  document.getElementById('shNote').textContent=reason||'Choose how you want to send your marks back:';
  var fb=document.getElementById('shFb');fb.classList.remove('show');fb.textContent='';
  var waTooBig=encodeURIComponent(payload).length>6000;
  var waBtn=document.getElementById('shWa'),waDesc=document.getElementById('shWaDesc');
  waBtn.disabled=waTooBig;
  waDesc.textContent=waTooBig?'Too large for direct WhatsApp text — use Copy text or Save .txt below':'Opens WhatsApp with your marks ready to send';
  document.getElementById('shareBg').classList.add('open');
}
function closeShareSheet(){document.getElementById('shareBg').classList.remove('open')}
document.getElementById('shClose').addEventListener('click',closeShareSheet);
document.getElementById('shareBg').addEventListener('click',function(e){if(e.target===this)closeShareSheet()});
document.getElementById('shWa').addEventListener('click',function(){
  if(!lastShare)return;
  var a=document.createElement('a');
  a.href='https://wa.me/?text='+encodeURIComponent(lastShare.payload);
  a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
});
document.getElementById('shCopy').addEventListener('click',function(){
  if(!lastShare)return;
  copyText(lastShare.payload,function(ok){
    var fb=document.getElementById('shFb');
    fb.textContent=ok?'Copied! Open WhatsApp and paste it to your coordinator.':'Could not copy automatically. Tap Save .txt file below.';
    fb.classList.add('show');
  });
});
document.getElementById('shTxt').addEventListener('click',function(){
  if(!lastShare)return;
  download(new Blob([lastShare.payload],{type:'text/plain;charset=utf-8'}),lastShare.fileName);
  var fb=document.getElementById('shFb');
  fb.textContent='Saved '+lastShare.fileName+' to Downloads. Attach that .txt file in WhatsApp to send.';
  fb.classList.add('show');
});

async function send(forceSheet){
  if(!guard())return;
  var obj=returnObj();
  if(!obj.count&&!confirm('You have not entered anything. Send anyway?'))return;
  revision=obj.revision;savedAt=obj.savedAt;persist();
  var payload=formatPayload(obj);
  var fileName=BASE+'_rev'+obj.revision+'.txt';
  var title=(CFG.assessmentName||'Marks')+(CFG.className?' ('+CFG.className+')':'')+' from '+(from||'teacher');
  var summary=(CFG.className||'Class')+' · '+(from||'Teacher')+' · '+obj.count+' mark'+(obj.count===1?'':'s');
  if(!forceSheet&&typeof navigator!=='undefined'&&navigator.share){
    try{
      var file=new File([payload],fileName,{type:'text/plain'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:title,text:summary});
        toast('Shared.');
        return;
      }
    }catch(e){if(e&&e.name==='AbortError')return}
    if(payload.length<=28000){
      try{
        await navigator.share({title:title,text:payload});
        toast('Shared.');
        return;
      }catch(e){if(e&&e.name==='AbortError')return}
    }
  }
  openShareSheet(payload,fileName,summary,forceSheet?'Choose how you want to send your marks back:':'Your browser blocked the system share menu on this offline file. Choose how to send it back:');
}

document.getElementById('bSend').addEventListener('click',function(){send(false)});
document.getElementById('more').innerHTML='<button class="tlink" id="bOpts" type="button">WhatsApp / Copy / .txt</button>'
  +'<button class="tlink" id="bSave" type="button">Save offline copy</button>'
  +'<button class="tlink" id="bReset" type="button">Reset my edits</button>';
document.getElementById('bOpts').addEventListener('click',function(){send(true)});
document.getElementById('bSave').addEventListener('click',saveCopy);
document.getElementById('bReset').addEventListener('click',function(){
  if(!changeCount()&&!Object.keys(maxes).length)return;
  if(!confirm('Undo all your changes in this file?'))return;
  edits={};maxes={};persist();refresh();drawRows();toast('Edits cleared.');
});

computeIssues();updateProgress();drawRows();
})();
</script>
</body>
